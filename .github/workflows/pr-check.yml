# .github/workflows/pr-check.yml

name: PR checks

on:
  pull_request:
    branches: [dev, main]    # runs on PRs targeting dev OR main

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: echo "No tests implemented yet"
        # Not using npm test because no test script exists in package.json
        # This keeps the check green without a failing exit code
        
      - name: Lint
        run: npm run lint --if-present    # only runs if lint script exists

  docker-build-check:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend dev image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false          # ← do NOT push on PR, just verify it builds
          cache-from: type=gha
          cache-to: type=gha,mode=max